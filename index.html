<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#df8a63">
    <title></title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <p class="eyebrow"></p>
        <h1></h1>
        <p class="subtitle"></p>
      </header>

      <section class="artwork" aria-label="CSS lighthouse illustration">
        <fieldset class="theme-picker">
          <legend>Palette</legend>
          <input type="radio" name="theme" id="dusk" checked>
          <label for="dusk">Dusk</label>
          <input type="radio" name="theme" id="midnight">
          <label for="midnight">Midnight</label>
        </fieldset>

        <figure class="scene" aria-label="A lighthouse on a rocky coast beneath a wide sky">
          <div class="sky" aria-hidden="true"></div>
          <div class="sun" aria-hidden="true"></div>
          <div class="far-shore" aria-hidden="true"></div>
          <div class="sea" aria-hidden="true"></div>
          <div class="light-beam" aria-hidden="true"></div>
          <div class="water-glint" aria-hidden="true"></div>
          <div class="cliff-back" aria-hidden="true"></div>
          <div class="cliff-front" aria-hidden="true"></div>
          <div class="tower-shadow" aria-hidden="true"></div>
          <div class="tower" aria-hidden="true"></div>
          <div class="lantern-room" aria-hidden="true"></div>
          <div class="lantern-roof" aria-hidden="true"></div>
          <div class="balcony" aria-hidden="true"></div>
          <div class="door" aria-hidden="true"></div>
          <div class="window" aria-hidden="true"></div>
          <div class="foreground-rock" aria-hidden="true"></div>
          <div class="bird bird-one" aria-hidden="true"></div>
          <div class="bird bird-two" aria-hidden="true"></div>
          <figcaption class="scene-note">Cape Stillwater · 18:42</figcaption>
        </figure>
      </section>

      <footer class="colophon">
        <span></span>
        <span></span>
      </footer>
    </main>
  </body>
</html>
